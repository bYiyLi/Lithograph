[workspace]
members = [
    "crates/lithograph-core",
    "crates/lithograph-embedding-provider",
    "crates/lithograph-extension",
    "crates/lithograph-fts5",
    "crates/lithograph-openai-compatible",
    "crates/lithograph-test-support",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-only"
repository = "https://github.com/bYiyLi/Lithograph"

[workspace.dependencies]
base64 = "0.23.1"
blake3 = "1.8.2"
chrono = "0.4.45"
chrono-tz = "0.10.4"
getrandom = "0.4.3"
httpdate = "1.0.3"
lithograph-fts5 = { path = "crates/lithograph-fts5", version = "=0.1.1" }
lithograph-embedding-provider = { path = "crates/lithograph-embedding-provider", version = "=0.1.1" }
pest = "=2.9.1"
pest_derive = "=2.9.1"
regex = "1.13.1"
rusqlite = { version = "=0.40.1", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "1"
tempfile = "3.21"
unicode-normalization = "0.1.25"
ureq = "3.1.4"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
warnings = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
cognitive_complexity = "deny"
dbg_macro = "deny"
multiple_unsafe_ops_per_block = "deny"
todo = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"
type_complexity = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
