[config]
default_to_workspace = false

[tasks.quality]
description = "Run the complete Lithograph maintainability and supply-chain quality gate."
dependencies = [
    "quality-vendor",
    "quality-lce1-golden",
    "quality-file-budget",
    "quality-format",
    "quality-clippy",
    "quality-rustdoc",
    "quality-complexity-production",
    "quality-complexity-support",
    "quality-complexity-c-smoke",
    "quality-duplicates",
    "quality-unused-deps",
    "quality-supply-chain",
    "quality-coverage",
]

[tasks.quality-vendor]
command = "python3"
args = ["scripts/check-vendor.py"]

[tasks.quality-lce1-golden]
command = "scripts/lce1-golden.sh"

[tasks.quality-file-budget]
script = '''
set -eu
warning_limit=1000
hard_limit=1400
failed=0
for file in $(find crates -type f -name '*.rs' -print | sort); do
  lines=$(wc -l < "$file" | tr -d ' ')
  if [ "$lines" -gt "$hard_limit" ]; then
    echo "$file: $lines lines exceeds hard Rust file budget $hard_limit" >&2
    failed=1
  elif [ "$lines" -gt "$warning_limit" ]; then
    echo "$file: $lines lines exceeds soft Rust file budget $warning_limit" >&2
  fi
done
exit "$failed"
'''

[tasks.quality-format]
command = "cargo"
args = ["fmt", "--check"]

[tasks.quality-clippy]
command = "cargo"
args = ["clippy", "--locked", "--workspace", "--all-targets", "--all-features"]

[tasks.quality-rustdoc]
env = { RUSTDOCFLAGS = "-D warnings" }
command = "cargo"
args = ["doc", "--locked", "--workspace", "--all-features", "--no-deps"]

[tasks.quality-complexity-production]
command = "python3"
args = [
    "-m", "lizard",
    "-l", "rust",
    "-C", "15",
    "-L", "100",
    "-a", "10",
    "crates/lithograph-core/src",
    "crates/lithograph-embedding-provider/src",
    "crates/lithograph-extension/src",
    "crates/lithograph-openai-compatible/src",
    "-x", "crates/lithograph-extension/src/tests.rs",
    "-w",
]

[tasks.quality-complexity-support]
command = "python3"
args = [
    "-m", "lizard",
    "-l", "rust",
    "-C", "20",
    "-L", "150",
    "-a", "10",
    "crates/lithograph-test-support/src",
    "-w",
]

[tasks.quality-complexity-c-smoke]
command = "python3"
args = [
    "-m", "lizard",
    "-C", "20",
    "-L", "150",
    "-a", "10",
    "tests/native_abi_smoke.c",
    "tests/openai_compatible_provider_smoke.c",
    "tests/phase13_semantic_concurrency.c",
    "tests/phase13_semantic_performance.c",
    "tests/phase11_adapter_bench.c",
    "tests/phase11_mixed_stress.c",
    "tests/phase11_stream_bench.c",
    "tests/synthetic_embedding_provider.c",
    "tests/synthetic_embedding_provider_smoke.c",
    "-w",
]

[tasks.quality-duplicates]
command = "jscpd"
args = [
    "crates/lithograph-core/src",
    "crates/lithograph-embedding-provider/src",
    "crates/lithograph-extension/src",
    "crates/lithograph-openai-compatible/src",
    "--format", "rust",
    "--min-lines", "5",
    "--min-tokens", "50",
    "--threshold", "1",
    "--max-lines", "5000",
    "--ignore", "**/tests.rs",
    "--reporters", "console",
    "--noTips",
]

[tasks.quality-unused-deps]
command = "cargo"
args = ["machete", "--with-metadata", "--skip-target-dir"]

[tasks.quality-supply-chain]
command = "cargo"
args = ["deny", "check"]

[tasks.quality-coverage]
script = '''
set -eu

# Keep extension unit tests in the quality gate, but measure production
# coverage from the same real SQLite load/ABI paths used by Phase 01.
cargo test --locked -p lithograph-extension --all-features
cargo test --locked -p lithograph-embedding-provider -p lithograph-openai-compatible --all-features

base_target=${CARGO_TARGET_DIR:-target}
mkdir -p "$base_target"
coverage_target=$(mktemp -d "$base_target/llvm-cov-integration.XXXXXX")
trap 'rm -rf "$coverage_target"' EXIT HUP INT TERM
export CARGO_TARGET_DIR="$coverage_target"

if [ -z "${LITHOGRAPH_SQLITE3:-}" ]; then
  for candidate in /opt/homebrew/opt/sqlite/bin/sqlite3 /usr/local/opt/sqlite/bin/sqlite3 "$(command -v sqlite3 2>/dev/null || true)"; do
    if [ -n "$candidate" ] && [ -x "$candidate" ]; then
      LITHOGRAPH_SQLITE3="$candidate"
      break
    fi
  done
fi
if [ -z "${LITHOGRAPH_SQLITE3:-}" ]; then
  echo "quality coverage requires a sqlite3 runtime" >&2
  exit 1
fi
export LITHOGRAPH_SQLITE3

eval "$(cargo llvm-cov show-env --sh)"
cargo test --locked -p lithograph-core -p lithograph-test-support --all-features
cargo test --locked -p lithograph-embedding-provider -p lithograph-openai-compatible --all-features
cargo build --locked -p lithograph-extension
cargo build --locked -p lithograph-openai-compatible

case "$(uname -s)" in
  Darwin)
    built_extension="$CARGO_TARGET_DIR/debug/liblithograph.dylib"
    extension="$CARGO_TARGET_DIR/debug/lithograph.dylib"
    openai_provider="$CARGO_TARGET_DIR/debug/liblithograph_openai_compatible.dylib"
    synthetic_provider="$CARGO_TARGET_DIR/phase13/synthetic_embedding_provider.dylib"
    ;;
  Linux)
    built_extension="$CARGO_TARGET_DIR/debug/liblithograph.so"
    extension="$CARGO_TARGET_DIR/debug/lithograph.so"
    openai_provider="$CARGO_TARGET_DIR/debug/liblithograph_openai_compatible.so"
    synthetic_provider="$CARGO_TARGET_DIR/phase13/synthetic_embedding_provider.so"
    ;;
  *)
    echo "quality coverage integration is supported on macOS and Linux" >&2
    exit 2
    ;;
esac

cp "$built_extension" "$extension"
sqlite_prefix=$(CDPATH= cd -- "$(dirname -- "$LITHOGRAPH_SQLITE3")/.." && pwd)
scripts/build-phase13-synthetic-provider.sh "$sqlite_prefix/include" "$synthetic_provider"
cargo run --locked --quiet -p lithograph-test-support --bin lithograph-phase01 -- "$extension"
cargo run --locked --quiet -p lithograph-test-support --bin lithograph-phase02 -- "$extension"
cargo run --locked --quiet -p lithograph-test-support --bin lithograph-phase03 -- "$extension"
cargo run --locked --quiet -p lithograph-test-support --bin lithograph-phase04 -- "$extension"
cargo run --locked --quiet -p lithograph-test-support --bin lithograph-phase05 -- "$extension"
cargo run --locked --quiet -p lithograph-test-support --bin lithograph-phase06 -- "$extension"
cargo run --locked --quiet -p lithograph-test-support --bin lithograph-phase07 -- "$extension"
cargo run --locked --quiet -p lithograph-test-support --bin lithograph-phase08 -- "$extension"
cargo run --locked --quiet -p lithograph-test-support --bin lithograph-phase09 -- "$extension"
rm -rf "$CARGO_TARGET_DIR/phase11-search-coverage"
LITHOGRAPH_PHASE11_SEARCH_DIR="$CARGO_TARGET_DIR/phase11-search-coverage" \
LITHOGRAPH_PHASE11_SEARCH_DOCUMENTS=512 \
LITHOGRAPH_PHASE11_SEARCH_HIGH_DIM_DOCUMENTS=64 \
LITHOGRAPH_PHASE11_SEARCH_LOW_DIMENSION=8 \
LITHOGRAPH_PHASE11_SEARCH_HIGH_DIMENSION=16 \
LITHOGRAPH_PHASE11_SEARCH_PROGRESS=256 \
  cargo run --locked --quiet -p lithograph-test-support --bin lithograph-phase11-search
cargo run --locked --quiet -p lithograph-test-support --bin lithograph-phase10-tck
scripts/native-abi-smoke.sh "$extension"
scripts/synthetic-embedding-provider-smoke.sh "$synthetic_provider"
scripts/openai-compatible-provider-smoke.sh "$openai_provider"
cargo run --locked --quiet -p lithograph-test-support --bin lithograph-phase13 -- \
  "$extension" "$synthetic_provider" "$openai_provider"

cargo llvm-cov report \
  --ignore-filename-regex 'crates/lithograph-test-support/src/bin/|crates/lithograph-extension/src/tests.rs' \
  --fail-under-regions 80 \
  --fail-under-functions 75 \
  --fail-under-lines 80 \
  --fail-under-file-lines 50
'''
