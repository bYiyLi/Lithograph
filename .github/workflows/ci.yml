name: CI

on:
  push:
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite coverage runtime
        run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt --component llvm-tools-preview
      - name: Install pinned quality tools
        run: |
          cargo install cargo-make --locked --version 0.37.24
          cargo install cargo-llvm-cov --locked --version 0.8.7
          cargo install cargo-deny --locked --version 0.20.2
          cargo install cargo-machete --locked --version 0.9.2
          cargo install jscpd-rs --locked --version 0.1.12
          python3 -m venv .quality-venv
          .quality-venv/bin/pip install --disable-pip-version-check lizard==1.24.0
          echo "$PWD/.quality-venv/bin" >> "$GITHUB_PATH"
      - name: Run quality gates
        run: cargo make quality

  phase-01-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
      - name: Verify pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version
      - name: Run canonical gates
        run: ./scripts/ci.sh

  macos-phase-01-gates:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite
        run: brew install sqlite
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
      - name: Select Homebrew SQLite
        run: echo "LITHOGRAPH_SQLITE3=$(brew --prefix sqlite)/bin/sqlite3" >> "$GITHUB_ENV"
      - name: Run canonical gates
        run: ./scripts/ci.sh

  windows-phase-01-gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build SQLite extension
        run: cargo build --locked -p lithograph-extension
      - name: Run Windows load, ABI, and artifact gates
        shell: pwsh
        run: ./scripts/windows-phase01-smoke.ps1 -ExtensionPath target/debug/lithograph.dll
