name: Release Matrix

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  storage-fixture:
    runs-on: ubuntu-24.04
    outputs:
      sqlite_gzip_base64: ${{ steps.fixture.outputs.sqlite_gzip_base64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release metadata
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          test -f "docs/releases/v${version}.md"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v${version}"
          fi
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Create cross-platform storage fixture
        id: fixture
        run: |
          mkdir -p target/phase10-interop
          cargo run --locked --quiet -p lithograph-test-support \
            --bin lithograph-phase10-storage-fixture -- \
            create target/phase10-interop/interop.sqlite
          printf 'sqlite_gzip_base64=' >> "$GITHUB_OUTPUT"
          gzip -c target/phase10-interop/interop.sqlite | base64 -w 0 >> "$GITHUB_OUTPUT"
          printf '\n' >> "$GITHUB_OUTPUT"
      - name: Upload storage fixture for debugging
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase10-storage-fixture
          path: target/phase10-interop/interop.sqlite
          if-no-files-found: error

  unix-artifacts:
    needs: storage-fixture
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            built: target/release/liblithograph.so
            artifact: target/release/lithograph.so
            provider_built: target/release/liblithograph_openai_compatible.so
            provider_artifact: target/release/lithograph-openai-compatible.so
          - name: linux-arm64
            os: ubuntu-24.04-arm
            built: target/release/liblithograph.so
            artifact: target/release/lithograph.so
            provider_built: target/release/liblithograph_openai_compatible.so
            provider_artifact: target/release/lithograph-openai-compatible.so
          - name: macos-x64
            os: macos-15-intel
            built: target/release/liblithograph.dylib
            artifact: target/release/lithograph.dylib
            provider_built: target/release/liblithograph_openai_compatible.dylib
            provider_artifact: target/release/lithograph-openai-compatible.dylib
          - name: macos-arm64
            os: macos-15
            built: target/release/liblithograph.dylib
            artifact: target/release/lithograph.dylib
            provider_built: target/release/liblithograph_openai_compatible.dylib
            provider_artifact: target/release/lithograph-openai-compatible.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install host SQLite on Linux
        if: startsWith(matrix.os, 'ubuntu-')
        run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev
      - name: Install host SQLite on macOS
        if: startsWith(matrix.os, 'macos-')
        run: brew install sqlite
      - name: Select Homebrew SQLite
        if: startsWith(matrix.os, 'macos-')
        run: echo "LITHOGRAPH_SQLITE3=$(brew --prefix sqlite)/bin/sqlite3" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Restore cross-platform storage fixture
        env:
          PHASE10_FIXTURE_GZIP_BASE64: ${{ needs.storage-fixture.outputs.sqlite_gzip_base64 }}
        run: |
          mkdir -p target/phase10-interop
          python3 -c 'import base64,gzip,os,pathlib; pathlib.Path("target/phase10-interop/interop.sqlite").write_bytes(gzip.decompress(base64.b64decode(os.environ["PHASE10_FIXTURE_GZIP_BASE64"])))'
      - name: Build release artifacts
        run: |
          cargo build --release --locked -p lithograph-extension
          cargo build --release --locked -p lithograph-openai-compatible
          cp "${{ matrix.built }}" "${{ matrix.artifact }}"
          cp "${{ matrix.provider_built }}" "${{ matrix.provider_artifact }}"
      - name: Run Phase 09 version regressions
        run: cargo test --release --locked -p lithograph-core --test phase09_version
      - name: Run release load, ABI, runtime, and interoperability gates
        run: scripts/release-artifact-smoke.sh "${{ matrix.artifact }}" target/phase10-interop/interop.sqlite "${{ matrix.provider_artifact }}"
      - name: Package distributable release asset
        run: |
          python3 scripts/package-release.py \
            --tag "v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)" \
            --binary "${{ matrix.artifact }}" \
            --binary "${{ matrix.provider_artifact }}" \
            --output "target/release/lithograph-${{ matrix.name }}.tar.gz"
      - name: Upload release artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lithograph-${{ matrix.name }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.provider_artifact }}
          if-no-files-found: error
      - name: Upload distributable release package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: target/release/lithograph-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  windows-artifacts:
    needs: storage-fixture
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: windows-arm64
            os: windows-11-vs2026-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Restore cross-platform storage fixture
        shell: pwsh
        env:
          PHASE10_FIXTURE_GZIP_BASE64: ${{ needs.storage-fixture.outputs.sqlite_gzip_base64 }}
        run: |
          New-Item -ItemType Directory -Force -Path target/phase10-interop | Out-Null
          $compressed = [Convert]::FromBase64String($env:PHASE10_FIXTURE_GZIP_BASE64)
          $inputStream = [IO.MemoryStream]::new($compressed)
          $gzipStream = [IO.Compression.GZipStream]::new(
            $inputStream,
            [IO.Compression.CompressionMode]::Decompress
          )
          $outputStream = [IO.File]::Create('target/phase10-interop/interop.sqlite')
          try {
            $gzipStream.CopyTo($outputStream)
          } finally {
            $outputStream.Dispose()
            $gzipStream.Dispose()
            $inputStream.Dispose()
          }
      - name: Build release artifacts
        shell: pwsh
        run: |
          cargo build --release --locked -p lithograph-extension
          cargo build --release --locked -p lithograph-openai-compatible
          Copy-Item target/release/lithograph_openai_compatible.dll target/release/lithograph-openai-compatible.dll
      - name: Run Phase 09, release load, ABI, runtime, and interoperability gates
        shell: pwsh
        run: ./scripts/windows-release-smoke.ps1 -ExtensionPath target/release/lithograph.dll -InteropFixture target/phase10-interop/interop.sqlite -OpenAIProviderPath target/release/lithograph-openai-compatible.dll
      - name: Package distributable release asset
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          python scripts/package-release.py `
            --tag "v$version" `
            --binary target/release/lithograph.dll `
            --binary target/release/lithograph-openai-compatible.dll `
            --output "target/release/lithograph-${{ matrix.name }}.zip"
      - name: Upload release artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lithograph-${{ matrix.name }}
          path: |
            target/release/lithograph.dll
            target/release/lithograph-openai-compatible.dll
          if-no-files-found: error
      - name: Upload distributable release package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: target/release/lithograph-${{ matrix.name }}.zip
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - unix-artifacts
      - windows-artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download distributable release packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify release package set and checksums
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            lithograph-linux-x64.tar.gz
            lithograph-linux-arm64.tar.gz
            lithograph-macos-x64.tar.gz
            lithograph-macos-arm64.tar.gz
            lithograph-windows-x64.zip
            lithograph-windows-arm64.zip
          )
          for asset in "${expected[@]}"; do
            test -s "dist/$asset"
          done
          test "$(find dist -maxdepth 1 -type f -name 'lithograph-*' | wc -l | tr -d ' ')" = "6"
          (
            cd dist
            sha256sum "${expected[@]}" | sort -k2 > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')
            test "$draft" = "true"
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --title "Lithograph $GITHUB_REF_NAME" \
              --notes-file "$notes"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = "false"
