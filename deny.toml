[graph]
all-features = true
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0459", reason = "Scoped to rusqlite 0.40.1 only: the all-features Cargo graph enables loadable_extension and min_sqlite_version_3_34_1, but not libsqlite3-sys/bundled; the extension links the host SQLite API. This suppresses the crate's bundled-copy advisory only; host SQLite security is separately constrained by docs/design/runtime.md. Re-review by 2027-02-08 or when a compatible 0.38 backport is published." },
]

[licenses]
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
