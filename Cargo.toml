[workspace]
members = [
    "crates/lithograph-core",
    "crates/lithograph-extension",
    "crates/lithograph-test-support",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-only"
repository = "https://github.com/bYiyLi/Lithograph"

[workspace.dependencies]
rusqlite = { version = "=0.40.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.21"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
warnings = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
cognitive_complexity = "deny"
dbg_macro = "deny"
multiple_unsafe_ops_per_block = "deny"
todo = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"
type_complexity = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
