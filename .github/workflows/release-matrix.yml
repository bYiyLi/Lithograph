name: Release Matrix

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  storage-fixture:
    runs-on: ubuntu-24.04
    outputs:
      sqlite_gzip_base64: ${{ steps.fixture.outputs.sqlite_gzip_base64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Create cross-platform storage fixture
        id: fixture
        run: |
          mkdir -p target/phase10-interop
          cargo run --locked --quiet -p lithograph-test-support \
            --bin lithograph-phase10-storage-fixture -- \
            create target/phase10-interop/interop.sqlite
          printf 'sqlite_gzip_base64=' >> "$GITHUB_OUTPUT"
          gzip -c target/phase10-interop/interop.sqlite | base64 -w 0 >> "$GITHUB_OUTPUT"
          printf '\n' >> "$GITHUB_OUTPUT"
      - name: Upload storage fixture for debugging
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase10-storage-fixture
          path: target/phase10-interop/interop.sqlite
          if-no-files-found: error

  unix-artifacts:
    needs: storage-fixture
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            built: target/release/liblithograph.so
            artifact: target/release/lithograph.so
          - name: linux-arm64
            os: ubuntu-24.04-arm
            built: target/release/liblithograph.so
            artifact: target/release/lithograph.so
          - name: macos-x64
            os: macos-15-intel
            built: target/release/liblithograph.dylib
            artifact: target/release/lithograph.dylib
          - name: macos-arm64
            os: macos-15
            built: target/release/liblithograph.dylib
            artifact: target/release/lithograph.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install host SQLite on Linux
        if: startsWith(matrix.os, 'ubuntu-')
        run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev
      - name: Install host SQLite on macOS
        if: startsWith(matrix.os, 'macos-')
        run: brew install sqlite
      - name: Select Homebrew SQLite
        if: startsWith(matrix.os, 'macos-')
        run: echo "LITHOGRAPH_SQLITE3=$(brew --prefix sqlite)/bin/sqlite3" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Restore cross-platform storage fixture
        env:
          PHASE10_FIXTURE_GZIP_BASE64: ${{ needs.storage-fixture.outputs.sqlite_gzip_base64 }}
        run: |
          mkdir -p target/phase10-interop
          python3 -c 'import base64,gzip,os,pathlib; pathlib.Path("target/phase10-interop/interop.sqlite").write_bytes(gzip.decompress(base64.b64decode(os.environ["PHASE10_FIXTURE_GZIP_BASE64"])))'
      - name: Build release artifact
        run: |
          cargo build --release --locked -p lithograph-extension
          cp "${{ matrix.built }}" "${{ matrix.artifact }}"
      - name: Run Phase 09 version regressions
        run: cargo test --release --locked -p lithograph-core --test phase09_version
      - name: Run release load, ABI, runtime, and interoperability gates
        run: scripts/release-artifact-smoke.sh "${{ matrix.artifact }}" target/phase10-interop/interop.sqlite
      - name: Upload release artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lithograph-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  windows-artifacts:
    needs: storage-fixture
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: windows-arm64
            os: windows-11-vs2026-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Restore cross-platform storage fixture
        shell: pwsh
        env:
          PHASE10_FIXTURE_GZIP_BASE64: ${{ needs.storage-fixture.outputs.sqlite_gzip_base64 }}
        run: |
          New-Item -ItemType Directory -Force -Path target/phase10-interop | Out-Null
          $compressed = [Convert]::FromBase64String($env:PHASE10_FIXTURE_GZIP_BASE64)
          $inputStream = [IO.MemoryStream]::new($compressed)
          $gzipStream = [IO.Compression.GZipStream]::new(
            $inputStream,
            [IO.Compression.CompressionMode]::Decompress
          )
          $outputStream = [IO.File]::Create('target/phase10-interop/interop.sqlite')
          try {
            $gzipStream.CopyTo($outputStream)
          } finally {
            $outputStream.Dispose()
            $gzipStream.Dispose()
            $inputStream.Dispose()
          }
      - name: Build release artifact
        run: cargo build --release --locked -p lithograph-extension
      - name: Run Phase 09 version regressions
        run: cargo test --release --locked -p lithograph-core --test phase09_version
      - name: Run release load, ABI, runtime, and interoperability gates
        shell: pwsh
        run: ./scripts/windows-release-smoke.ps1 -ExtensionPath target/release/lithograph.dll -InteropFixture target/phase10-interop/interop.sqlite
      - name: Upload release artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lithograph-${{ matrix.name }}
          path: target/release/lithograph.dll
          if-no-files-found: error
